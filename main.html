<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- MUST be Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

<div class="container mt-3"
     style="width:600px;border:5px solid rgb(4,255,4);background:rgb(41,0,0);">

  <!-- ROW 1 -->
  <div class="row mb-2"
       style="height:200px;border:5px solid rgb(255,188,188);">

    <div class="col-sm-6 col-md-4"
         style="border:2px dotted rgb(38,38,43);background:teal; width:150px">
      Row1 col1
    </div>

    <div class="col-sm-6 col-md-8"
         style="border:2px dotted rgb(38,38,43);background:thistle; width:372px">
      Row1 col2
    </div>
  </div>

  <!-- ROW 2 -->
  <div class="row mb-2"
       style="height:200px;border:5px solid rgb(255,188,188);">

    <div class="col-sm-5 col-md-4 offset-md-2"
         style="border:2px dotted rgb(38,38,43);background:tomato; width: 130px; margin-left: 70px;">
      Row2 col1
    </div>

    <div class="col-sm-5 col-md-4"
         style="border:2px dotted rgb(38,38,43);background:turquoise; margin-left:122px; width:200px">
      Row2 col2
    </div>
  </div>

  <!-- ROW 3 -->
  <div class="row justify-content-center"
       style="height:200px;border:5px solid rgb(255,188,188);">

    <div class="col-sm-5 col-md-4"
         style="border:2px dotted rgb(38,38,43);background:violet;">
      Row3 col1
    </div>

    <div class="col-sm-5 col-md-4"
         style="border:2px dotted rgb(38,38,43);background:yellowgreen;">
      Row3 col2
    </div>
  </div>

</div>

</body>
</html>
